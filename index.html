<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Celebration | Zed-Kelvin</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --accent: #00d4ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Using your requested image */
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* The Grid Overlay - Keeps the Apple aesthetic over your image */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black, transparent 90%);
            opacity: 0.3;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 3.5rem;
            text-align: center;
            width: 550px;
            max-width: 90%;
            transition: all 1s ease-in-out;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 5px;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }

        .time-box span {
            display: block;
            font-size: 3rem;
            font-weight: 700;
        }

        .time-box label {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        .prayer-message {
            margin-top: 2.5rem;
            font-size: 1rem;
            line-height: 1.7;
            font-weight: 300;
            opacity: 0.9;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        /* NEW YEAR THEME CLASS */
        .celebration-mode {
            background: rgba(255, 215, 0, 0.15); /* Golden tint */
            border: 1px solid rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.2);
        }

        .celebration-mode h1 {
            color: #ffd700;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 2px;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #ffd700; }
            50% { text-shadow: 0 0 30px #ffd700, 0 0 50px #ffae00; }
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <div class="container" id="main-card">
        <h1 id="header-text">Countdown to 2026</h1>
        
        <div class="countdown" id="timer-display">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Min</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Sec</label>
            </div>
        </div>

        <div class="prayer-message">
            "As the new year dawns, I pray that the Almighty grants you the strength to soar and the wisdom to lead. May 2026 be a testament to His goodness in your life. Be blessed and highly favored in Jesus' name."
            <br><br>
            <strong style="color: var(--accent);">— Zed-Kelvin</strong>
        </div>
    </div>

    <script>
        const card = document.getElementById('main-card');
        const header = document.getElementById('header-text');
        const timerDisplay = document.getElementById('timer-display');

        function updateCountdown() {
            const targetDate = new Date('January 1, 2026 00:00:00').getTime();
            const now = new Date().getTime();
            const gap = targetDate - now;

            if (gap <= 0) {
                // THEME CHANGE LOGIC
                header.innerText = "HAPPY NEW YEAR 2026!";
                timerDisplay.style.display = 'none';
                card.classList.add('celebration-mode');
                return;
            }

            const second = 1000, minute = second * 60, hour = minute * 60, day = hour * 24;

            document.getElementById('days').innerText = Math.floor(gap / day);
            document.getElementById('hours').innerText = Math.floor((gap % day) / hour).toString().padStart(2, '0');
            document.getElementById('minutes').innerText = Math.floor((gap % hour) / minute).toString().padStart(2, '0');
            document.getElementById('seconds').innerText = Math.floor((gap % minute) / second).toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
