<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Countdown | Zed-Kelvin</title>
    <style>
        :root {
            /* Apple-style Glass variables */
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --gold-accent: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        body {
            /* This links your background.png to the site */
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* Subtle grid overlay to enhance the "Sleek" look */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle, black, transparent 90%);
            z-index: 1;
        }

        .glass-card {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 3rem;
            width: 520px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-weight: 200;
            letter-spacing: 6px;
            font-size: 1rem;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 2rem;
        }

        .unit span {
            display: block;
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .unit label {
            font-size: 0.65rem;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 2px;
        }

        .prayer-zone {
            border-top: 1px solid var(--glass-border);
            padding-top: 2rem;
            font-weight: 300;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .author {
            display: block;
            margin-top: 15px;
            color: #00d4ff;
            font-weight: 500;
        }

        /* NEW YEAR THEME ACTIVATION */
        .ny-theme {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold-accent);
            transform: scale(1.05);
        }

        .ny-theme h1 {
            color: var(--gold-accent);
            font-size: 2.2rem;
            font-weight: 800;
            animation: celebrate 1.5s infinite alternate;
        }

        @keyframes celebrate {
            from { text-shadow: 0 0 10px var(--gold-accent); }
            to { text-shadow: 0 0 30px #ffae00, 0 0 10px #fff; }
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <div class="glass-card" id="card">
        <h1 id="title">Awaiting 2026</h1>

        <div class="countdown-grid" id="timer">
            <div class="unit">
                <span id="d">00</span>
                <label>Days</label>
            </div>
            <div class="unit">
                <span id="h">00</span>
                <label>Hours</label>
            </div>
            <div class="unit">
                <span id="m">00</span>
                <label>Min</label>
            </div>
            <div class="unit">
                <span id="s">00</span>
                <label>Sec</label>
            </div>
        </div>

        <div class="prayer-zone">
            "May the grace of our Lord Jesus Christ be with you as we cross into this new season. I pray that 2026 meets you with joy, health, and favor in every endeavor."
            <span class="author">— Zed-Kelvin</span>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const title = document.getElementById('title');
        const timer = document.getElementById('timer');

        function startCountdown() {
            const target = new Date('January 1, 2026 00:00:00').getTime();
            
            setInterval(() => {
                const now = new Date().getTime();
                const diff = target - now;

                if (diff <= 0) {
                    // Switch to Happy New Year Theme
                    title.innerHTML = "HAPPY NEW YEAR!";
                    timer.style.display = "none";
                    card.classList.add('ny-theme');
                    return;
                }

                // Calculations
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('d').innerText = days;
                document.getElementById('h').innerText = hours.toString().padStart(2, '0');
                document.getElementById('m').innerText = mins.toString().padStart(2, '0');
                document.getElementById('s').innerText = secs.toString().padStart(2, '0');
            }, 1000);
        }

        startCountdown();
    </script>
</body>
</html>
